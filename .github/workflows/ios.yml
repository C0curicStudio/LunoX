name: iOS IPA

on:
  push:
    branches: [claude/focused-gauss-7jmxgt, main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls /Applications | grep -i '^Xcode' || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned, device SDK)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project LunoX.xcodeproj -scheme LunoX \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/LunoX.app

      - name: Package IPA
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LunoX.app Payload/
          zip -qry LunoX-unsigned.ipa Payload
          ls -lh LunoX-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LunoX-unsigned-ipa
          path: |
            ios/LunoX-unsigned.ipa
            ios/build.log
