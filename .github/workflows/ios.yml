name: iOS

on:
  push:
    branches: [claude/focused-gauss-7jmxgt, main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

jobs:
  ipa:
    name: Build IPA
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
          xcodebuild -version
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build (unsigned, device SDK, Release)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project LunoX.xcodeproj -scheme LunoX -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
          grep -q "BUILD SUCCEEDED" build.log
          test -f build/Build/Products/Release-iphoneos/LunoX.app/LunoX
      - name: Package IPA
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LunoX.app Payload/
          zip -qry LunoX-unsigned.ipa Payload
          ls -lh LunoX-unsigned.ipa
      - name: Show errors / warnings
        if: always()
        working-directory: ios
        run: |
          grep -E 'error:' build.log | sort -u | head -60 || true
          echo "--- warnings"; grep -E 'warning:' build.log | grep -v appintents | sort -u | head -30 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LunoX-unsigned-ipa
          path: |
            ios/LunoX-unsigned.ipa
            ios/build.log

  test-and-screens:
    name: Unit tests + simulator screenshots
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$X" ]; then sudo xcode-select -s "$X/Contents/Developer"; fi
      - run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone [0-9]+ Pro \(" | grep -v Max | tail -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -n "$UDID" ] || UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test -project LunoX.xcodeproj -scheme LunoX -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | grep -E "Test (Case|Suite).*(passed|failed)|error:|TEST (SUCCEEDED|FAILED)|Executed" || true
          grep -q "TEST SUCCEEDED" test.log
      - name: Screenshots of every screen
        if: always()
        working-directory: ios
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          APP=$(find build-sim/Build/Products -name LunoX.app -path "*iphonesimulator*" 2>/dev/null | head -1)
          if [ -z "$APP" ]; then   # tests failed to build -> still build the app so we can look at it
            xcodebuild build -project LunoX.xcodeproj -scheme LunoX -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO > build-sim.log 2>&1 || true
            APP=$(find build-sim/Build/Products -name LunoX.app -path "*iphonesimulator*" | head -1)
          fi
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance light || true
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true   # show the on-screen keyboard
          mkdir -p shots
          shot() { # name theme appearance demo [extra...]
            n=$1; t=$2; ap=$3; d=$4; shift 4
            xcrun simctl launch --terminate-running-process "$UDID" app.lunox.browser -demo "$d" "$@" -theme "$t" -appearance "$ap" >/dev/null
            sleep ${WAIT:-7}
            xcrun simctl io "$UDID" screenshot "shots/$n.png" >/dev/null 2>&1 || true
          }
          shot 01-newtab-light safari light newtab
          shot 02-newtab-dark safari dark newtab
          shot 03-newtab-sakura sakura light newtab
          shot 04-newtab-dusk-dark dusk dark newtab
          shot 05-search safari light search
          shot 06-menu-light safari light menu
          shot 07-menu-dark safari dark menu
          shot 08-settings safari light settings
          shot 09-themes safari light themes
          shot 10-themes-dark safari dark themes
          shot 11-extensions safari light extensions
          shot 12-ai safari light ai
          shot 13-private safari light private
          shot 14-find safari light find
          WAIT=14 shot 20-web-light safari light web
          WAIT=14 shot 21-web-dark safari dark web
          WAIT=16 shot 22-web-menu safari light web2
          WAIT=14 shot 23-switcher-light safari light switcher
          WAIT=14 shot 24-switcher-dark mint dark switcher
          ls -la shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshots
          path: |
            ios/shots
            ios/test.log
            ios/build-sim.log
      - name: Fail if unit tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
