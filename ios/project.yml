name: LunoX
options:
  bundleIdPrefix: app.lunox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  LunoX:
    type: application
    platform: iOS
    sources: [LunoX]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lunox.browser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LunoX/App/Info.plist
  LunoXTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LunoXTests]
    dependencies:
      - target: LunoX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.lunox.browser.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LunoX.app/LunoX"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  LunoX:
    build:
      targets:
        LunoX: all
    test:
      targets: [LunoXTests]
